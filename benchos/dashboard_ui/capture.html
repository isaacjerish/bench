<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Benchy — Visual Inspection</title><link rel="stylesheet" href="/app.css"></head>
<body class="capture-page" data-token="__BENCHY_TOKEN__">
<main class="capture-card">
  <p class="capture-kicker">BENCHY</p>
  <h1>Visual Inspection</h1>
  <p id="capture-lead">Take a clear photo of your device under test.</p>
  <div id="capture-pick" class="capture-actions">
    <label class="primary-button">Take Photo<input id="take-photo" class="capture-file" type="file" accept="image/*" capture="environment"></label>
    <label class="small-button">Choose Existing Photo<input id="choose-photo" class="capture-file" type="file" accept="image/*"></label>
  </div>
  <div id="capture-review" hidden>
    <img id="capture-preview" class="capture-preview" alt="Selected device photo">
    <div class="capture-actions">
      <button id="capture-upload" class="primary-button" type="button">Upload</button>
      <button id="capture-retake" class="small-button" type="button">Retake</button>
    </div>
  </div>
  <p id="capture-status" class="capture-status" role="status" hidden></p>
</main>
<script>
const token = document.body.dataset.token;
const pick = document.getElementById('capture-pick');
const review = document.getElementById('capture-review');
const preview = document.getElementById('capture-preview');
const status = document.getElementById('capture-status');
let prepared = null;
let previewUrl = '';
let polling = false;

function showStatus(text) {
  status.hidden = false;
  status.textContent = text;
}

function resetPreview() {
  prepared = null;
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = '';
  preview.removeAttribute('src');
  review.hidden = true;
  pick.hidden = false;
}

async function prepare(file) {
  if (!file) return;
  showStatus('Preparing photo…');
  try {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(bitmap.width * scale));
    canvas.height = Math.max(1, Math.round(bitmap.height * scale));
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.85));
    if (!blob) throw Error('Could not prepare that photo.');
    if (blob.size > 5 * 1024 * 1024) throw Error('Photo is still larger than 5 MB.');
    prepared = blob;
  } catch (error) {
    prepared = null;
    showStatus(error.message || 'Use a JPEG, PNG, or WEBP photo.');
    return;
  }
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(prepared);
  preview.src = previewUrl;
  pick.hidden = true;
  review.hidden = false;
  status.hidden = true;
}

async function upload() {
  if (!prepared) return;
  document.getElementById('capture-upload').disabled = true;
  showStatus('Sending photo…');
  try {
    const response = await fetch('/capture/' + token, {method:'POST', headers:{'Content-Type':'image/jpeg'}, body:prepared});
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw Error(data.error || 'Upload failed.');
    review.hidden = true;
    showStatus('IMAGE RECEIVED ✓');
    poll();
  } catch (error) {
    document.getElementById('capture-upload').disabled = false;
    showStatus(error.message || 'Upload failed.');
  }
}

async function poll() {
  if (polling) return;
  polling = true;
  try {
    const response = await fetch('/capture/' + token + '/status');
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      showStatus(data.error || 'This capture link is not valid.');
      polling = false;
      return;
    }
    if (data.status === 'uploaded') showStatus('IMAGE RECEIVED ✓');
    else if (data.status === 'analyzing') showStatus('IMAGE RECEIVED ✓\nAnalyzing DUT...');
    else if (data.status === 'complete') {
      showStatus('Analysis complete.\nReturn to Benchy to view the results.');
      polling = false;
      return;
    } else if (data.status === 'error') {
      showStatus(data.error || 'Visual analysis failed.');
      polling = false;
      pick.hidden = false;
      return;
    } else if (data.status === 'expired') {
      showStatus('This capture link has expired. Ask Benchy for a new QR code.');
      polling = false;
      return;
    }
  } catch {
    showStatus('Could not reach Benchy.');
    polling = false;
    return;
  }
  polling = false;
  setTimeout(poll, 1000);
}

document.getElementById('take-photo').addEventListener('change', event => prepare(event.target.files[0]));
document.getElementById('choose-photo').addEventListener('change', event => prepare(event.target.files[0]));
document.getElementById('capture-upload').addEventListener('click', upload);
document.getElementById('capture-retake').addEventListener('click', () => { resetPreview(); status.hidden = true; });
poll();
</script>
</body>
</html>
