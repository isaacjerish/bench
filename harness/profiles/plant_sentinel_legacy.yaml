# This is user-declared wiring, not automatic circuit discovery.
version: 1
declared_on: "2026-09-26"
voltage_limit_v: 3.3
lab:
  board: ESP32-S3
  usb_serial_number: 94:A9:90:DB:BA:64
dut:
  board: ESP32-C6
  usb_serial_number: A0:85:E3:DA:BD:80
  serial_port_hint: /dev/cu.usbmodem5
  firmware: plant_sentinel
  sketch_path: dut_examples/plant_sentinel
  fqbn: esp32:esp32:esp32c6:CDCOnBoot=cdc
  connected_sensor: photoresistor, water-level sensor, replacement MPU-6500-compatible breakout
  sensor_sda: C6 IO5
  sensor_scl: C6 IO7
source_files:
  - dut_examples/plant_sentinel/plant_sentinel.ino
  - dut_examples/plant_sentinel/config.h
dut_pins:
  IO1: {net: LIGHT_SENSE, function: Analog input}
  IO2: {net: WATER_SENSE, function: Analog input}
  IO5: {net: MPU_SDA, function: I²C data}
  IO7: {net: MPU_SCL, function: I²C clock}
  IO20: {net: ALARM_DRIVE, function: LED output}
telemetry_checks:
  - {probe: P1, field: light_mv, scale_to_v: 0.001, max_delta_v: 0.45}
  - {probe: P3, field: water_mv, scale_to_v: 0.001, max_delta_v: 0.45}
postflash:
  serial_marker: build=plant-sentinel-v1
  timeout_s: 8
  check_telemetry: true
probes:
  P1:
    state: connected
    net: LIGHT_SENSE
    tip: breadboard row T
    adc: S3 IO1 via 10k/10k divider
    digital: S3 IO2 direct input
    note: photoresistor node and C6 IO1 are connected
  P2:
    state: connected
    net: MPU_VCC
    expected_min_v: 3.0
    expected_max_v: 3.3
    tip: breadboard row U
    adc: S3 IO4 via 10k/10k divider
    digital: S3 IO5 direct input
    note: user connected tip U to MPU VCC; P2 passed 3V3, GND, and sensor VCC checks
  P3:
    state: connected
    net: WATER_SENSE
    tip: water sensor S row W
    adc: S3 IO6 through 10k series resistor, no divider
    digital: S3 IO7 through separate 10k series resistor
    note: user connected water sensor plus to C6 3V3, minus to shared GND, S to C6 IO2 and separate 10k series S3 IO6/IO7 branches; S3 measured 0.000 V dry and 0.833–0.897 V wet
digital_taps:
  D1: {state: connected, net: MPU_SDA, endpoint: MPU SDA row, gpio: 8, series_resistor_ohm: 10000}
  D2: {state: connected, net: MPU_SCL, endpoint: MPU SCL row, gpio: 9, series_resistor_ohm: 10000}
  D3: {state: connected, net: MPU_SDA, endpoint: C6 IO5 source junction, gpio: 10, series_resistor_ohm: 6800}
  D4: {state: connected, net: MPU_SCL, endpoint: C6 IO7 source junction, gpio: 11, series_resistor_ohm: 6800}
  D5: {state: connected, net: ALARM_DRIVE, endpoint: C6 IO20 before LED resistor, gpio: 12, series_resistor_ohm: 6800, max_transitions_per_s: 8}
bus_monitor:
  state: connected
  sda_net: MPU_SDA
  scl_net: MPU_SCL
  sda_input: S3 IO8 through 10k series resistor
  scl_input: S3 IO9 through 10k series resistor
  note: user wired S3 IO8/IO9 through separate 10k series resistors to MPU SDA/SCL; both counted transitions with DUT serial open
