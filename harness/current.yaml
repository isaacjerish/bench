# User-declared wiring; healthy light/water/LED behavior physically checked 2026-09-26.
# Conditional alert=1 activity check passed live after color rewire, 2026-09-26.
version: 1
declared_on: '2026-09-26'
voltage_limit_v: 3.3
lab:
  board: ESP32-S3
  usb_serial_number: 94:A9:90:DB:BA:64
  required_profile: series-taps-v1
dut:
  board: ESP32-C6
  usb_serial_number: A0:85:E3:DA:BD:80
  firmware: parcel_guard
  sketch_path: dut_examples/parcel_guard
  fqbn: esp32:esp32:esp32c6:CDCOnBoot=cdc
source_files:
- dut_examples/parcel_guard/parcel_guard.ino
- dut_examples/parcel_guard/config.h
dut_pins:
  IO1:
    net: LIGHT_SENSE
    function: Lid light input
  IO2:
    net: WATER_SENSE
    function: Leak input
  IO20:
    net: ALARM_DRIVE
    function: Alarm LED output
telemetry_checks:
- probe: P1
  field: light_mv
  scale_to_v: 0.001
  max_delta_v: 0.45
- probe: P2
  field: water_mv
  scale_to_v: 0.001
  max_delta_v: 0.45
activity_checks:
- {tap: D3, field: alert, equals: 1, min_transitions_per_s: 3, max_transitions_per_s: 5}
- {tap: D3, field: alert, equals: 0, min_transitions_per_s: 0, max_transitions_per_s: 0}
postflash:
  serial_marker: build=parcel-guard-v1
  timeout_s: 8
  check_telemetry: true
probes:
  P1:
    state: connected
    net: LIGHT_SENSE
    tip: Photoresistor leg connected to C6 IO1
    adc: S3 IO1 via shared 6.8k series tap
    digital: S3 IO8 at the free end of the photoresistor 6.8k resistor
    note: No divider; ADC scale 1
  P2:
    state: connected
    net: WATER_SENSE
    tip: Water sensor S connected to C6 IO2
    adc: S3 IO4 via shared 6.8k series tap
    digital: S3 IO9 at the free end of the water-sensor 6.8k resistor
    note: No divider; ADC scale 1
  P3:
    state: connected
    net: ALARM_DRIVE
    tip: C6 IO20 before the LED resistor
    adc: S3 IO6 via shared 6.8k series tap
    digital: S3 IO10 at the free end of the LED-drive 6.8k resistor
    note: Switched signal; ADC sample is not a waveform
digital_taps:
  D1:
    state: connected
    net: LIGHT_SENSE
    endpoint: Photoresistor leg connected to C6 IO1 through 6.8k resistor
    gpio: 8
    series_resistor_ohm: 6800
  D2:
    state: connected
    net: WATER_SENSE
    endpoint: Water sensor S connected to C6 IO2 through 6.8k resistor
    gpio: 9
    series_resistor_ohm: 6800
  D3:
    state: connected
    net: ALARM_DRIVE
    endpoint: C6 IO20 before the LED resistor through 6.8k resistor
    gpio: 10
    series_resistor_ohm: 6800
    max_transitions_per_s: 6
  D4:
    state: disconnected
    net: UNUSED_4
    endpoint: unconnected S3 IO11
    gpio: 11
    series_resistor_ohm: 6800
  D5:
    state: disconnected
    net: UNUSED_5
    endpoint: unconnected S3 IO12
    gpio: 12
    series_resistor_ohm: 6800
bus_monitor:
  state: disconnected
  note: This circuit has no I2C bus; use the permanent digital taps.
