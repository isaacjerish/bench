[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchos"
version = "0.1.0"
description = "Physical circuit measurements for coding agents"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8,<10"]

[project.scripts]
benchos = "benchos.cli:main"

[tool.setuptools.packages.find]
include = ["benchos*"]

[tool.setuptools.package-data]
"benchos.dashboard_ui" = ["*.html", "*.css", "*.js", "*.png"]
